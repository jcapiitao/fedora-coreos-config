apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/jcapiitao/fedora-coreos-config?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "testing-devel"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: fedora-coreos-config-testing-devel-jcapitao
    appstudio.openshift.io/component: fcos-testing-devel-jcapitao
    pipelines.appstudio.openshift.io/type: build
  name: fcos-testing-devel-jcapitao-on-pull-request
  namespace: coreos-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/konflux-fedora/coreos-tenant/fcos-testing-devel-jcapitao:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: Containerfile
  - name: path-context
    value: .
  - name: privileged-nested
    value: true
  - name: build-args
    value: ["VERSION=42", "BUILDER_IMG=quay.io/fedora/fedora-bootc:42", "MANIFEST=manifest.yaml", "PASSWD_GROUP_DIR=manifests"]
  pipelineRef:
    params:
    - name: bundle
      value: quay.io/bootc-devel/tekton-catalog/pipeline-buildah-build-bootc-multi-platform-oci-ta@sha256:a39bc3e36b697385b8e5fb69d8257d3a58cb8199eab5ead8f265ae5ad1f2bbc2
    - name: name
      value: buildah-build-bootc-multi-platform-oci-ta
    - name: kind
      value: pipeline
    resolver: bundles
  taskRunTemplate:
    serviceAccountName: build-pipeline-fcos-testing-devel-jcapitao
